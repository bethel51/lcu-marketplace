<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The official Lead City University student marketplace — buy, sell and swap within campus." />
    <title>Lead City Marketplace | LCU Student Hub</title>

    <!-- Preconnect for faster font fetch -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- font-display=swap prevents invisible text during font load -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />

    <!-- Flutterwave -->
    <script src="https://checkout.flutterwave.com/v3.js" defer></script>

    <!-- ── Inline App-Shell Loader ──────────────────────────────
         Shows instantly before React JS even downloads.
         Removed by React once #root is populated.
    ─────────────────────────────────────────────────────────── -->
    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      :root{
        --shell-bg:#090f1d;
        --shell-gold:#3b82f6;
        --shell-border:rgba(255,255,255,0.07);
      }
      body{background:var(--shell-bg);font-family:'Inter',sans-serif;}

      /* Top progress bar */
      #app-progress{
        position:fixed;top:0;left:0;z-index:9999;
        height:3px;width:0%;
        background:linear-gradient(90deg,#1d4ed8,#3b82f6,#60a5fa);
        border-radius:0 3px 3px 0;
        box-shadow:0 0 12px rgba(59,130,246,0.7);
        transition:width 0.4s cubic-bezier(0.16,1,0.3,1);
      }

      /* Full-screen shell loader */
      #app-shell{
        position:fixed;inset:0;z-index:9998;
        background:var(--shell-bg);
        display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:28px;
        transition:opacity 0.35s ease,visibility 0.35s ease;
      }
      #app-shell.hidden{opacity:0;visibility:hidden;pointer-events:none;}

      /* Brand logo area */
      .shell-brand{display:flex;align-items:center;gap:14px;}
      .shell-logo{
        width:48px;height:48px;border-radius:50%;
        object-fit:contain;
        border:2px solid var(--shell-gold);
        box-shadow:0 0 20px rgba(59,130,246,0.4);
      }
      .shell-name{display:flex;flex-direction:column;}
      .shell-title{
        font-family:'Outfit',sans-serif;font-weight:800;
        font-size:1.4rem;color:#fff;letter-spacing:-0.02em;
      }
      .shell-sub{
        font-size:0.72rem;font-weight:600;letter-spacing:0.12em;
        text-transform:uppercase;color:rgba(255,255,255,0.4);
      }

      /* Animated ring spinner */
      .shell-spinner{
        width:44px;height:44px;border-radius:50%;
        border:3px solid rgba(255,255,255,0.08);
        border-top:3px solid var(--shell-gold);
        animation:shell-spin 0.9s linear infinite;
      }
      @keyframes shell-spin{to{transform:rotate(360deg);}}

      /* Skeleton pulse bars */
      .shell-skeletons{
        display:flex;flex-direction:column;gap:10px;
        width:min(340px,80vw);
      }
      .shell-skel{
        height:10px;border-radius:8px;
        background:linear-gradient(90deg,
          rgba(255,255,255,0.04) 0%,
          rgba(255,255,255,0.10) 50%,
          rgba(255,255,255,0.04) 100%);
        background-size:200% 100%;
        animation:shell-shimmer 1.6s ease-in-out infinite;
      }
      .shell-skel:nth-child(1){width:75%;}
      .shell-skel:nth-child(2){width:55%;}
      .shell-skel:nth-child(3){width:65%;}
      @keyframes shell-shimmer{
        0%{background-position:200% 0}
        100%{background-position:-200% 0}
      }
    </style>
    <script>
      // Animate progress bar to 80% while JS loads
      var _prog = document.getElementById('app-progress');
      if(_prog){ _prog.style.width='80%'; }
    </script>
  </head>
  <body>
    <!-- Pre-React branded shell — hidden once React mounts -->
    <div id="app-progress"></div>
    <div id="app-shell">
      <div class="shell-brand">
        <img src="/logo.png" alt="LCU" class="shell-logo" width="48" height="48" />
        <div class="shell-name">
          <span class="shell-title">Lead City</span>
          <span class="shell-sub">Marketplace</span>
        </div>
      </div>
      <div class="shell-spinner"></div>
      <div class="shell-skeletons">
        <div class="shell-skel"></div>
        <div class="shell-skel"></div>
        <div class="shell-skel"></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
